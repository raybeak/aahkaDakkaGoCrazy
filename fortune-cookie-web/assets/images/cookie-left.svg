<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cookieGradLeft" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
    <linearGradient id="innerShadowLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(120, 53, 15, 0.6)" />
      <stop offset="100%" stop-color="rgba(120, 53, 15, 0)" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Left Crescent Outer Wing -->
    <path d="M 100,30 C 50,30 15,65 15,115 C 15,155 50,175 95,145 C 80,125 70,95 100,75 Z" fill="url(#cookieGradLeft)" />
    <!-- Highlight stroke on top curve -->
    <path d="M 95,35 C 55,36 25,68 22,110" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.35" />
    <!-- Inner fold crevice shadow -->
    <path d="M 95,145 C 80,125 70,95 100,75 Z" fill="url(#innerShadowLeft)" />
  </g>
</svg>
