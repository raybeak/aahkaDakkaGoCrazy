<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cookieGradRight" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF7D6" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
    <linearGradient id="innerShadowRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(120, 53, 15, 0.6)" />
      <stop offset="100%" stop-color="rgba(120, 53, 15, 0)" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Right Crescent Outer Wing -->
    <path d="M 100,30 C 150,30 185,65 185,115 C 185,155 150,175 105,145 C 120,125 130,95 100,75 Z" fill="url(#cookieGradRight)" />
    <!-- Highlight stroke on top curve -->
    <path d="M 105,35 C 145,36 175,68 178,110" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.3" />
    <!-- Inner fold crevice shadow -->
    <path d="M 105,145 C 120,125 130,95 100,75 Z" fill="url(#innerShadowRight)" />
  </g>
</svg>
